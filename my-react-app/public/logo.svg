<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90">
  <!-- Shopping bag -->
  <g transform="translate(10 6)">
    <!-- handle -->
    <path d="M22 18 C 22 6, 50 6, 50 18"
          fill="none" stroke="#1f5b8a" stroke-width="4" stroke-linecap="round"/>
    <!-- bag body -->
    <path d="M8 20 H64 L60 78 H12 Z"
          fill="#F2A900" stroke="#d99100" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- paw print: main pad -->
    <ellipse cx="36" cy="55" rx="11" ry="9" fill="#2774AE"/>
    <!-- paw print: toes -->
    <ellipse cx="22" cy="42" rx="4" ry="5" fill="#2774AE"/>
    <ellipse cx="31" cy="36" rx="4" ry="5.5" fill="#2774AE"/>
    <ellipse cx="41" cy="36" rx="4" ry="5.5" fill="#2774AE"/>
    <ellipse cx="50" cy="42" rx="4" ry="5" fill="#2774AE"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(90 0)" font-family="'Bricolage Grotesque', Helvetica, Arial, sans-serif" fill="#2774AE">
    <text x="0" y="50" font-size="40" font-weight="800" font-style="italic" letter-spacing="1">BRUIN</text>
    <text x="2" y="74" font-size="20" font-weight="500" letter-spacing="6">MARKET</text>
  </g>
</svg>
